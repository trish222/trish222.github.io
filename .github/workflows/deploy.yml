name: Deploy to GitHub Pages

on:
  push:
    branches: [main, theme/windows98]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Both branches publish to the same Pages site; avoid overlapping deploys.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      - name: Verify deployment files
        run: npm run check:build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # This tells GitHub to take the folder Vite created
          path: './dist'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
