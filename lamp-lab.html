<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lamp lab</title>
    <!--
      A dev harness for looking at one lamp module on its own under the
      room's night rig. `npm run dev`, then lamp-lab.html?lamp=greenlamp.

      It is deliberately NOT in vite.config.js's build inputs, so
      `vite build` ignores it and nothing here reaches dist/ — same
      standing as the _*.mjs review scripts.
    -->
    <style>
      :root {
        color-scheme: dark;
        --void: #1c1a2a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--void);
        color: #d8d4e6;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      #lab { display: block; width: 100vw; height: 100vh; touch-action: none; }
      /* Bottom-left, because the lamp is framed on the box's bounding
         sphere and a panel in the top corner sat straight over the
         shade. */
      #panel {
        position: fixed;
        bottom: 16px;
        left: 16px;
        padding: 12px 14px;
        max-width: min(92vw, 430px);
        opacity: 0.94;
        background: rgba(12, 11, 20, 0.72);
        border: 1px solid rgba(216, 212, 230, 0.16);
        border-radius: 6px;
        backdrop-filter: blur(6px);
      }
      #hud { margin: 0; white-space: pre; font: inherit; }
      #toggle {
        margin-top: 10px;
        padding: 6px 12px;
        font: inherit;
        color: #1c1a2a;
        background: #ffb866;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      #toggle:hover { background: #ffc98c; }
      noscript { position: fixed; inset: 40% 0 auto; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="lab"></canvas>
    <div id="panel">
      <pre id="hud">loading…</pre>
      <button id="toggle" type="button">toggle the lamp</button>
    </div>
    <noscript>The lamp lab needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/lamp-lab.js"></script>
  </body>
</html>
